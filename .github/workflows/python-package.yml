name: python-package

on:
  push:
    tags: ["python-v*"]
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist implementations/python
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.x"]  # the oldest supported (requires-python) and the newest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - name: Install the wheel and test the installed command
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/hashfasta --version
          python -m unittest discover -s implementations/python/tests
          python tests/run_conformance.py --cmd /tmp/venv/bin/hashfasta

  publish:
    # Runs only for tags like python-v0.1.0, after configuring PyPI trusted
    # publishing for this repository, workflow and the "pypi" environment.
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' implementations/python/src/hashfasta/__init__.py)
          test "python-v$version" = "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
